  weight_decay: 0.03

model:
  hidden_layers: 2
  dropout_rate: 0.0
  alpha_weight: 1.0
  beta_weight: 1.0
  gamma_weight: 1.0

gain:
  miss_rate: 0.1
  hint_rate: 0.9
