data:
  raw_path: null
  prepared_dir: "data/processed/small_toy_hela/miss_10" # Directory with the prepared dataset (reference.csv, missing.csv, mask.csv, domain.csv)

train:
  epochs: 2
  early_stop_patience: 10
  batch_size: 6
