[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gainpro"
version = "0.1.0"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["GenerativeProteomics*"]d

[project.scripts]
gainpro = "GenerativeProteomics.main:main"